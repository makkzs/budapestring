<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{

    --ink:#191817; --muted:#5c5852; --faint:#726c64;
    --line:#ddd8d0; --hair:#ebe6de; --bg:#f7f4ef; --card:#fffdfa;
    --accent:#7d3f22;

    --sel:#ff5c00; --selcase:#2a2622; --ring:#4a443d; --ringcase:#fffdfa;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
           "Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}

  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.65 var(--sans);
       -webkit-font-smoothing:antialiased;}

  .topbar{position:sticky;top:0;z-index:500;background:var(--bg);
          border-bottom:1px solid var(--line)}
  .bar{max-width:960px;margin:0 auto;padding:0 24px;
       display:flex;align-items:center;gap:26px;height:52px}
  .mark{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;
        color:var(--ink);text-decoration:none;white-space:nowrap}
  .bar nav{flex:1;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{font:12px var(--sans);letter-spacing:.06em;text-transform:uppercase;
             color:var(--muted);text-decoration:none;white-space:nowrap;
             padding:4px 0;border-bottom:1px solid transparent}
  .bar nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
  .langs{flex:none;font:12px var(--sans);letter-spacing:.04em}
  .langs button{background:none;border:0;padding:9px 8px;cursor:pointer;
                color:var(--faint);font:inherit;min-height:32px}
  .langs button:hover{color:var(--ink)}
  .langs button[aria-current="true"]{color:var(--ink);
                border-bottom:1px solid var(--accent)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .wrap{max-width:960px;margin:0 auto;padding:0 24px 90px}
  header{padding:60px 0 0}
  h1{font:500 clamp(2.2rem,6vw,3.2rem)/1.05 var(--sans);margin:0;
     letter-spacing:-.035em}
  .sub{color:var(--muted);font-size:1.05rem;margin:12px 0 0;max-width:40ch}
  .lede{margin:34px 0 0;max-width:66ch}
  .lede p{margin:0 0 12px;color:var(--muted)}
  p{max-width:66ch}

  section{margin:52px 0 0;scroll-margin-top:66px}
  .eyebrow{font:600 10px var(--sans);letter-spacing:.17em;text-transform:uppercase;
           color:var(--faint);margin:0 0 12px;display:block}
  h2{font:500 1.25rem/1.3 var(--sans);margin:0 0 10px;letter-spacing:-.02em;
     padding-top:16px;border-top:1px solid var(--line)}
  section > p:first-of-type{margin-top:0}

  .figures{display:flex;flex-wrap:wrap;gap:0;margin:26px 0 0;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .figures > div{flex:1 1 0;min-width:118px;padding:16px 18px 15px;
                 border-left:1px solid var(--hair);
                 font:11px var(--sans);letter-spacing:.11em;text-transform:uppercase;
                 color:var(--faint)}
  .figures > div:first-child{border-left:0;padding-left:0}
  .figures b{display:block;font:500 1.9rem/1 var(--sans);color:var(--ink);
             letter-spacing:-.035em;margin:0 0 7px;text-transform:none;
             font-variant-numeric:tabular-nums}
  .stats{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 0}
  .stats > div{flex:1 1 0;min-width:92px;padding:14px 14px 0 0;
               font:10px var(--sans);letter-spacing:.12em;text-transform:uppercase;
               color:var(--faint)}
  .stats b{display:block;font:500 1.35rem/1 var(--sans);color:var(--ink);
           margin:0 0 5px;text-transform:none;letter-spacing:-.03em;
           font-variant-numeric:tabular-nums}

  .split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
         gap:0;margin:26px 0 0;border:1px solid var(--line);background:var(--card)}
  .split .mapcol{min-width:0}
  .split .pickcol{min-width:0;border-left:1px solid var(--line);
                  padding:20px 22px 24px;display:flex;flex-direction:column}
  .map{height:100%;min-height:470px;background:#eae6e0}
  .panel{background:var(--card);border:1px solid var(--line);
         padding:22px 24px 26px;margin:20px 0 0}
  @media (max-width:860px){
    .split{grid-template-columns:1fr}
    .split .pickcol{border-left:0;border-top:1px solid var(--line)}

    .map{height:380px;min-height:0}
  }
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .controls label{display:block;margin:0 0 6px;
                  font:600 10px var(--sans);letter-spacing:.14em;
                  text-transform:uppercase;color:var(--faint)}
  .controls select{font:15px var(--sans);padding:7px 26px 7px 9px;
                   border:0;border-bottom:1px solid var(--ink);border-radius:0;
                   background:transparent;color:var(--ink);max-width:250px;
                   appearance:none;cursor:pointer;
                   background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                                    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
                   background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;
                   background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .controls select:focus-visible{border-bottom-color:var(--accent)}

  .elev{width:100%;height:auto;display:block;margin:18px 0 0}
  .elev path.fill{fill:rgba(255,92,0,.12)}
  .elev path.line{fill:none;stroke:var(--sel);stroke-width:1.6}
  .elev line{stroke:var(--line)}
  .elev text{font:10px ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
  a.btn,button.btn{display:inline-block;margin:20px 10px 0 0;padding:0 0 3px;
      font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;
      border:0;border-bottom:1px solid var(--ink);background:none;
      color:var(--ink);cursor:pointer;text-decoration:none}
  a.btn:hover,button.btn:hover{color:var(--accent);border-bottom-color:var(--accent)}

  button.btn.quiet{font:13px var(--sans);letter-spacing:0;text-transform:none;
      color:var(--muted);border-bottom:1px dotted var(--line);padding:2px 0 2px;
      min-height:32px}
  button.btn.quiet:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .sellabel{font:500 1.05rem/1.35 var(--sans);margin:22px 0 0;letter-spacing:-.01em}
  .sellabel .dir{display:block;font:11px var(--sans);letter-spacing:.11em;
                 text-transform:uppercase;color:var(--faint);margin:5px 0 0}
  .panelhead{font:600 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;
             color:var(--muted);margin:0 0 14px;display:block}
  .notice{background:var(--card);border:1px solid var(--line);
          border-left:3px solid var(--accent);
          padding:20px 22px;margin:34px 0 0;font:15px/1.65 var(--sans)}
  .notice code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
               background:#f0ebe3;padding:2px 5px}
  .hint{font:13px/1.6 var(--sans);color:var(--muted);margin:12px 0 0}
  .hint code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
             background:#ece7df;padding:2px 6px;color:var(--ink)}
  .facilities{font:13px var(--sans);color:var(--muted);margin:16px 0 0}

  .finishers{list-style:none;padding:0;margin:22px 0 0;
             columns:2;column-gap:40px}
  .finishers li{break-inside:avoid;margin:0 0 9px;font:15px/1.4 var(--sans)}
  .finishers li span{display:block;font:11px var(--sans);letter-spacing:.11em;
                     text-transform:uppercase;color:var(--faint);margin:2px 0 0}
  @media (max-width:620px){ .finishers{columns:1} }

  .privacy{margin:26px 0 0;font:13px/1.7 var(--sans);color:var(--muted);
           max-width:70ch}
  .privacy summary{cursor:pointer;color:var(--ink);
                   font:600 11px var(--sans);letter-spacing:.13em;
                   text-transform:uppercase}
  .privacy p{margin:12px 0 0}

  footer{margin-top:70px;padding-top:22px;border-top:1px solid var(--line);
         font:13px/1.7 var(--sans);color:var(--faint)}
  footer a{color:var(--muted)}
  footer p{margin:0 0 6px;max-width:70ch}

  @media (max-width:620px){
    body{font-size:16px}
    .bar{gap:16px;padding:0 18px}
    .bar nav{gap:14px}
    .wrap{padding:0 18px 70px}
    header{padding-top:40px}
    .sub{max-width:none}
    .map{height:340px}
    .figures > div{flex:1 1 45%;min-width:0;padding:14px 12px;
                   border-top:1px solid var(--hair)}
    .figures > div:nth-child(-n+2){border-top:0}
    .figures > div:nth-child(odd){border-left:0;padding-left:0}
    .figures b{font-size:1.7rem}
    .controls select{max-width:100%;width:100%}
    .controls > div{width:100%}
    .map{height:340px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="bar">
    <a class="mark" href="#top">Budapest kör</a>
    <nav>
      <a href="#ring" data-t="navRing"></a>
      <a href="#get"  data-t="navGet"></a>
      <a href="#see"  data-t="navSee"></a>
      <a href="#done" data-t="navDone"></a>
    </nav>
    <div class="langs">
      <button id="lang-hu" lang="hu" onclick="setLang('hu')">Magyar</button>
      <button id="lang-en" lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</div>

<div class="wrap">

<header id="top">
  <h1 data-t="title">Budapest kör</h1>
  <p class="sub" data-t="tagline"></p>
</header>

<div id="setup" class="notice" hidden></div>

<main id="main" hidden>

  <div class="lede">
    <p data-t="intro1"></p>
    <p data-t="intro2"></p>
  </div>

  <section id="ring">
    <h2 data-t="ringHead"></h2>
    <span class="eyebrow" data-t="ringEyebrow"></span>
    <div class="figures" id="totalstats"></div>

    <div class="split">
      <div class="mapcol"><div class="map" id="map"></div></div>
      <div class="pickcol">
        <span class="panelhead" data-t="pickHead"></span>
        <div class="controls">
          <div>
            <label for="from" data-t="fromLabel"></label>
            <select id="from"></select>
          </div>
          <div>
            <label for="to" data-t="toLabel"></label>
            <select id="to"></select>
          </div>
          <button class="btn quiet" id="swap" data-t="swap" data-title="swapTitle"></button>
        </div>
        <p class="sellabel" id="sellabel" aria-live="polite"></p>
        <div class="stats" id="selstats"></div>
        <div id="selelev"></div>
        <button class="btn quiet" id="dirbtn"></button>
        <p class="facilities" id="selfac"></p>
        <button class="btn" id="dl-sel"></button>
      </div>
    </div>
    <p class="hint" id="maphint"></p>
  </section>

  <section id="get">
    <h2 data-t="wholeHead"></h2>
    <p data-t="wholeBody"></p>
    <button class="btn" id="dl-all" data-t="dlAll"></button>
  </section>

  <section id="see">
    <h2 data-t="seeHead"></h2>
    <p data-t="seeBody"></p>
    <a class="btn" id="osmlink" target="_blank" rel="noopener" data-t="osmBtn"></a>
  </section>

  <section id="done">
    <h2 data-t="doneHead"></h2>
    <p data-t="doneBody"></p>
    <ul class="finishers" id="finishers"></ul>
    <p data-t="doneJoin" id="donejoin"></p>
    <details class="privacy">
      <summary data-t="privHead"></summary>
      <p data-t="privBody"></p>
    </details>
  </section>

</main>

<footer>
  <p data-t="foot1"></p>
  <p data-t="credit"></p>
  <p data-t="names"></p>
  <p data-t="foot2"></p>
</footer>

</div>

let LANG = "hu";
let PTS = null;
let ENTRY_IDX = [];
let MAP = null, SELLINE = null, SELMARKS = [], ENTRYMARKS = [];
let DIR = "cw";
let MAPPICK = 0;
const RING_OPT = "__ring";
let INIT = {};
let FINISHERS = null;

const R = 6371000;

function t(k){
  const e = TEXT[k];
  const s = e ? (e[LANG] ?? e.hu) : k;
  return s.split("%a").join(CONTACT);
}

function escHTML(s){
  return String(s).replace(/[&<>"]/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

const CSSVAR = (n) =>
  getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function hav(a, b){
  const p = Math.PI/180;
  const dLat = (b.lat-a.lat)*p, dLon = (b.lon-a.lon)*p;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

function parseGPX(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("Hibás GPX fájl.");
  let nodes = [...doc.getElementsByTagName("trkpt")];
  if (!nodes.length) nodes = [...doc.getElementsByTagName("rtept")];
  if (!nodes.length) throw new Error("Nincs nyomvonalpont a fájlban.");
  const pts = nodes.map(n => {
    const e = n.getElementsByTagName("ele")[0];
    return {
      lat: parseFloat(n.getAttribute("lat")),
      lon: parseFloat(n.getAttribute("lon")),
      ele: e ? parseFloat(e.textContent) : null
    };
  }).filter(p => isFinite(p.lat) && isFinite(p.lon));
  let d = 0; pts[0].d = 0;
  for (let i=1;i<pts.length;i++){ d += hav(pts[i-1], pts[i]); pts[i].d = d; }
  return pts;
}

function nearestIndex(pts, lat, lon){
  let best = 0, bd = Infinity;
  const target = {lat, lon};
  for (let i=0;i<pts.length;i++){
    const dd = hav(pts[i], target);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}

function ascent(pts){
  const els = pts.map(p => p.ele).filter(e => e != null);
  if (els.length < 3) return 0;
  const W = 5, sm = [];
  for (let i=0;i<els.length;i++){
    let s = 0, n = 0;
    for (let j=Math.max(0,i-W); j<=Math.min(els.length-1,i+W); j++){ s += els[j]; n++; }
    sm.push(s/n);
  }
  const TH = 3;
  let up = 0, ref = sm[0];
  for (let i=1;i<sm.length;i++){
    const dz = sm[i] - ref;
    if (dz > TH){ up += dz; ref = sm[i]; }
    else if (dz < -TH){ ref = sm[i]; }
  }
  return up;
}

function km(m){
  const s = (m/1000).toFixed(1);
  return (LANG === "hu" ? s.replace(".", ",") : s) + " km";
}

function ringSlice(iFrom, iTo, dir){
  const n = PTS.length;
  const out = [];
  if (dir === "cw"){
    let i = iFrom;
    for (;;){ out.push(PTS[i]); if (i === iTo && out.length > 1) break;
              i = (i + 1) % n; if (out.length > n) break; }
  } else {
    let i = iFrom;
    for (;;){ out.push(PTS[i]); if (i === iTo && out.length > 1) break;
              i = (i - 1 + n) % n; if (out.length > n) break; }
  }

  const s = out.map(p => ({lat:p.lat, lon:p.lon, ele:p.ele, d:0}));
  let d = 0;
  for (let i=1;i<s.length;i++){ d += hav(s[i-1], s[i]); s[i].d = d; }
  return s;
}

function statBlock(pts){
  const len = pts[pts.length-1].d - pts[0].d;
  const up = ascent(pts);
  const hrs = len/1000/3.5 + up/600;
  const h = Math.floor(hrs), m = Math.round((hrs-h)*60);
  const hu = LANG === "hu";
  return `<div><b>${km(len)}</b>${t("lenLabel")}</div>
          <div><b>${Math.round(up)} m</b>${t("upLabel")}</div>
          <div><b>${h} ${hu?"ó":"h"} ${m} ${hu?"p":"min"}</b>${t("timeLabel")}</div>`;
}

function elevationSVG(pts){
  const withEle = pts.filter(p => p.ele != null);
  if (withEle.length < 3) return "";

  const W = 420, H = 132, PAD = 22;
  const d0 = withEle[0].d, dN = withEle[withEle.length-1].d;
  const span = dN - d0 || 1;
  const els = withEle.map(p => p.ele);
  const lo = Math.min(...els), hi = Math.max(...els);
  const range = (hi - lo) || 1;
  const x = p => PAD + (p.d - d0)/span * (W - PAD*2);
  const y = p => H - PAD - (p.ele - lo)/range * (H - PAD*2);
  const step = Math.max(1, Math.floor(withEle.length/400));
  const samp = withEle.filter((_,i) => i % step === 0);
  if (samp[samp.length-1] !== withEle[withEle.length-1]) samp.push(withEle[withEle.length-1]);
  const line = samp.map((p,i) => (i?"L":"M") + x(p).toFixed(1) + " " + y(p).toFixed(1)).join(" ");
  const fill = line + ` L ${x(samp[samp.length-1]).toFixed(1)} ${H-PAD} L ${x(samp[0]).toFixed(1)} ${H-PAD} Z`;
  return `<svg class="elev" viewBox="0 0 ${W} ${H}" role="img"
       aria-label="${t("elevAlt")}">
    <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}"></line>
    <path class="fill" d="${fill}"></path>
    <path class="line" d="${line}"></path>
    <text x="${PAD}" y="${PAD-6}">${Math.round(hi)} m</text>
    <text x="${PAD}" y="${H-PAD+14}">${Math.round(lo)} m</text>
    <text x="${W-PAD}" y="${H-PAD+14}" text-anchor="end">${km(span)}</text>
  </svg>`;
}

function toGPX(pts, name){
  const body = pts.map(p =>
    `   <trkpt lat="${p.lat}" lon="${p.lon}">${p.ele!=null?`<ele>${p.ele}</ele>`:""}</trkpt>`
  ).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Budapest kör — budapestring.hu" xmlns="http://www.topografix.com/GPX/1/1">
 <metadata><name>${name}</name><link href="https://budapestring.hu"/></metadata>
 <trk><name>${name}</name><trkseg>
${body}
 </trkseg></trk>
</gpx>`;
}

function download(text, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/gpx+xml"}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function slug(s){
  return s.toLowerCase()
    .replace(/[áà]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i")
    .replace(/[óöő]/g,"o").replace(/[úüű]/g,"u")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function entryName(e){ return LANG === "hu" ? e.hu : (e.en || e.hu); }

function fillSelects(){
  const from = document.getElementById("from"), to = document.getElementById("to");
  const keepF = from.value, keepT = to.value;
  from.innerHTML = ENTRY_IDX.map(e =>
    `<option value="${e.id}">${entryName(e)}</option>`).join("");
  const ok = (v, sel) => v && [...sel.options].some(o => o.value === v);
  from.value = (ok(keepF, from) && keepF) || (ok(INIT.from, from) && INIT.from) ||
               (ENTRY_IDX[0] && ENTRY_IDX[0].id) || "";
  fillToSelect(keepT);
}

function ringLen(iFrom, iTo, dir){
  const total = PTS[PTS.length-1].d;
  const cw = ((PTS[iTo].d - PTS[iFrom].d) % total + total) % total;
  return (dir === "cw" ? cw : total - cw) || total;
}

function fillToSelect(want){
  const from = document.getElementById("from"), to = document.getElementById("to");
  const keep = want || to.value;

  const k = ENTRY_IDX.findIndex(e => e.id === from.value);
  const order = k < 0 ? ENTRY_IDX
                      : ENTRY_IDX.slice(k).concat(ENTRY_IDX.slice(0, k));
  const a = ENTRY_IDX[k];
  const opts = order.map(e =>
    `<option value="${e.id}">${entryName(e)}` +
    (a && e.id !== a.id
       ? ` — ${km(ringLen(a.i, e.i, shorterDir(a.i, e.i)))}` : "") +
    `</option>`).join("");

  to.innerHTML = `<option value="${RING_OPT}">${t("wholeOpt")} — ` +
                 `${km(PTS[PTS.length-1].d)}</option>` + opts;
  const ok = v => v && [...to.options].some(o => o.value === v);
  to.value = (ok(keep) && keep) || (ok(INIT.to) && INIT.to) ||
             (ENTRY_IDX[1] || ENTRY_IDX[0] || {}).id || "";
}

function shorterDir(iFrom, iTo){
  if (iFrom === iTo) return "cw";
  const n = PTS.length;
  const cw = (iTo - iFrom + n) % n;
  return cw <= n - cw ? "cw" : "ccw";
}

function currentSelection(){
  const fid = document.getElementById("from").value;
  const tid = document.getElementById("to").value;
  const a = ENTRY_IDX.find(e => e.id === fid);
  const b = (tid === RING_OPT) ? a : ENTRY_IDX.find(e => e.id === tid);
  if (!a || !b) return null;
  return { a, b, dir:DIR, whole: tid === RING_OPT || a.id === b.id,
           pts: ringSlice(a.i, b.i, DIR) };
}

function syncURL(){
  const u = new URL(location);
  u.searchParams.set("from", document.getElementById("from").value);
  u.searchParams.set("to",   document.getElementById("to").value);
  u.searchParams.set("dir",  DIR);
  history.replaceState(null, "", u);
}

function renderSelection(){
  fillToSelect();
  const sel = currentSelection();
  const box = document.getElementById("selstats");
  const dlb = document.getElementById("dl-sel");
  const lab = document.getElementById("sellabel");
  const dbt = document.getElementById("dirbtn");
  if (!sel){ box.innerHTML = ""; lab.innerHTML = ""; dlb.hidden = true;
             dbt.hidden = true; return; }
  dlb.hidden = false;
  box.innerHTML = statBlock(sel.pts);
  document.getElementById("selelev").innerHTML = elevationSVG(sel.pts);

  const title = sel.whole ? t("fullRingFrom").replace("%s", entryName(sel.a))
                          : `${entryName(sel.a)} – ${entryName(sel.b)}`;
  lab.innerHTML = title +
    `<span class="dir">${t(DIR === "cw" ? "dirCW" : "dirCCW")}</span>`;

  const other = DIR === "cw" ? "ccw" : "cw";
  const opts = ringSlice(sel.a.i, sel.b.i, other);
  dbt.hidden = false;
  dbt.textContent = t("otherWay").replace("%s",
    km(opts[opts.length-1].d - opts[0].d));
  dbt.title = t("otherWayTitle");
  dbt.onclick = () => { DIR = other; renderSelection(); };

  const names = { water:{hu:"ivóvíz",en:"water"}, coffee:{hu:"kávé",en:"coffee"},
                  wc:{hu:"vécé",en:"toilet"} };
  const bits = [];
  [sel.a, sel.b].forEach((e, k) => {
    if (k === 1 && sel.a.id === sel.b.id) return;
    const parts = [];
    if (e.bkv) parts.push(e.bkv);
    if (e.walkTo) parts.push(t("walkTo").replace("%s",
      e.walkTo >= 1000 ? km(e.walkTo) : e.walkTo + " m"));
    (e.has||[]).forEach(f => parts.push((names[f]||{})[LANG] || f));
    if (parts.length) bits.push(entryName(e) + ": " + parts.join(", "));
  });
  document.getElementById("selfac").textContent = bits.join("  ·  ");

  updateMailLinks();

  if (SELLINE) SELLINE.forEach(l => MAP.removeLayer(l));
  SELMARKS.forEach(m => MAP.removeLayer(m));
  SELMARKS = [];

  const sll = sel.pts.map(p => [p.lat, p.lon]);
  SELLINE = [
    L.polyline(sll, {color:CSSVAR("--selcase"), weight:9, opacity:.85,
                     lineJoin:"round", lineCap:"round"}).addTo(MAP),
    L.polyline(sll, {color:CSSVAR("--sel"), weight:5, opacity:1,
                     lineJoin:"round", lineCap:"round"}).addTo(MAP)
  ];
  SELLINE.forEach(l => l.bringToFront());

  const ends = [[sel.pts[0], true], [sel.pts[sel.pts.length-1], false]];
  ends.forEach(([p, filled]) => {
    const m = L.circleMarker([p.lat, p.lon], {
      radius:7, weight:2.5, color:CSSVAR("--selcase"),
      fillColor: filled ? CSSVAR("--sel") : CSSVAR("--card"), fillOpacity:1
    }).addTo(MAP);
    m.bringToFront();
    SELMARKS.push(m);
  });
  ENTRYMARKS.forEach(m => m.bringToFront());

  dlb.textContent = t("dlSel");
  dlb.onclick = () => download(toGPX(sel.pts, "Budapest kör — " + title),
                               "budapest-kor-" + slug(title) + ".gpx");
  syncURL();
}

function drawMap(){
  MAP = L.map("map", {scrollWheelZoom:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(MAP);
  const latlngs = PTS.map(p => [p.lat, p.lon]);

  L.polyline(latlngs, {color:CSSVAR("--ringcase"), weight:7, opacity:.9,
                       lineJoin:"round", lineCap:"round"}).addTo(MAP);
  const ring = L.polyline(latlngs, {color:CSSVAR("--ring"), weight:3, opacity:1,
                                    lineJoin:"round", lineCap:"round"}).addTo(MAP);

  MAP.fitBounds(ring.getBounds(), {padding:[22,22]});
  ENTRYMARKS = [];
  ENTRY_IDX.forEach(e => {
    const at = [PTS[e.i].lat, PTS[e.i].lon];

    const pick = () => {
      const from = document.getElementById("from");
      const to = document.getElementById("to");
      if (MAPPICK === 0){
        from.value = e.id;
        to.value = RING_OPT;
        MAPPICK = 1;
      } else {
        to.value = e.id;
        MAPPICK = 0;
        const sel = currentSelection();
        if (sel) DIR = shorterDir(sel.a.i, sel.b.i);
      }
      renderSelection();
      updateHint();
    };

    L.circleMarker(at, {radius:14, opacity:0, fillOpacity:0, interactive:true})
      .addTo(MAP).bindTooltip(entryName(e)).on("click", pick);
    ENTRYMARKS.push(L.circleMarker(at,
      {radius:4, color:CSSVAR("--ringcase"), weight:1.5,
       fillColor:CSSVAR("--ink"), fillOpacity:1, interactive:false}).addTo(MAP));
  });
  setTimeout(() => MAP.invalidateSize(), 0);

  if (new URLSearchParams(location.search).has("collect")){
    MAP.on("click", ev => {
      const i = nearestIndex(PTS, ev.latlng.lat, ev.latlng.lng);
      document.getElementById("maphint").innerHTML =
        `<code>{ id:"", hu:"", en:"", at:[${PTS[i].lat.toFixed(6)}, ` +
        `${PTS[i].lon.toFixed(6)}], bkv:"", has:[] },</code> — ${km(PTS[i].d)}`;
    });
  }
}

function renderStatic(){
  document.documentElement.lang = LANG;
  document.title = LANG === "hu"
    ? "Budapest kör — gyalogos körtúra Budapest körül"
    : "Budapest kör — a walk around Budapest";
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t(el.dataset.t);
    if (v) el.innerHTML = v;
  });

  document.querySelectorAll("[data-title]").forEach(el => {
    el.title = t(el.dataset.title);
  });
  document.getElementById("lang-hu").setAttribute("aria-current", LANG === "hu");
  document.getElementById("lang-en").setAttribute("aria-current", LANG === "en");

  document.querySelector("[data-t='foot2']").innerHTML =
    t("feedback").replace("%s", "#");
  renderFinishers();
  updateMailLinks();
}

function mailtoURL(subject, body){
  return "mailto:" + CONTACT +
         "?subject=" + encodeURIComponent(subject) +
         (body ? "&body=" + encodeURIComponent(body) : "");
}

function selectionName(){
  const sel = PTS ? currentSelection() : null;
  if (!sel) return t("fbNoSel");
  const where = sel.whole ? t("fullRingFrom").replace("%s", entryName(sel.a))
                          : entryName(sel.a) + " – " + entryName(sel.b);
  return where + ", " + t(sel.dir === "cw" ? "dirCW" : "dirCCW");
}

function updateMailLinks(){
  const fb = document.getElementById("fblink");
  if (fb) fb.href = mailtoURL(t("fbSubj"),
                              t("fbBody").replace("%s", selectionName()));
  const jn = document.getElementById("joinlink");
  if (jn) jn.href = mailtoURL(t("joinSubj"), t("joinBody"));
}

function renderFinishers(){
  const ul = document.getElementById("finishers");
  if (!ul) return;
  if (!FINISHERS || !FINISHERS.length){
    ul.innerHTML = `<li>${escHTML(t("doneEmpty"))}</li>`;
    return;
  }

  ul.innerHTML = FINISHERS.map(f =>
    "<li>" + escHTML(f.name) +
    (f.year ? "<span>" + escHTML(f.year) + "</span>" : "") + "</li>"
  ).join("");
}

function updateHint(){
  if (new URLSearchParams(location.search).has("collect")) return;
  document.getElementById("maphint").textContent =
    t(MAPPICK === 0 ? "hintStart" : "hintEnd");
}

function renderAll(){
  renderStatic();
  if (!PTS) return;
  document.getElementById("totalstats").innerHTML = statBlock(PTS);
  updateHint();
  fillSelects();
  renderSelection();
}

function setLang(l){
  LANG = (l === "en") ? "en" : "hu";
  const u = new URL(location);
  u.searchParams.set("lang", LANG);
  history.replaceState(null, "", u);
  renderAll();
}

function render(pts){
  PTS = pts;
  ENTRY_IDX = ENTRIES
    .map(e => ({...e, i: nearestIndex(pts, e.at[0], e.at[1])}))
    .sort((a,b) => pts[a.i].d - pts[b.i].d);

  document.getElementById("setup").hidden = true;
  document.getElementById("main").hidden = false;

  fillSelects();
  const first = currentSelection();
  DIR = (INIT.dir === "cw" || INIT.dir === "ccw") ? INIT.dir
      : (first ? shorterDir(first.a.i, first.b.i) : "cw");

  drawMap();
  document.getElementById("dl-all").onclick = () =>
    download(toGPX(PTS, "Budapest kör"), "budapest-kor.gpx");

  const osm = document.getElementById("osmlink");
  if (OSM_TRACE_URL) osm.href = OSM_TRACE_URL; else osm.hidden = true;

  ["from","to"].forEach(id =>
    document.getElementById(id).addEventListener("change", () => {
      const sel = currentSelection();
      if (sel) DIR = shorterDir(sel.a.i, sel.b.i);
      MAPPICK = 0;
      renderSelection();
      updateHint();
    }));
  document.getElementById("swap").onclick = () => {
    const f = document.getElementById("from"), tsel = document.getElementById("to");
    if (tsel.value === RING_OPT) return;
    [f.value, tsel.value] = [tsel.value, f.value];

    DIR = (DIR === "cw") ? "ccw" : "cw";
    MAPPICK = 0;
    renderSelection();
    updateHint();
  };

  renderAll();
}

function boot(){
  const q = new URLSearchParams(location.search);
  const p = q.get("lang");
  LANG = p === "en" ? "en"
       : p === "hu" ? "hu"
       : (navigator.language || "").toLowerCase().startsWith("hu") ? "hu" : "en";
  INIT = { from:q.get("from"), to:q.get("to"), dir:q.get("dir") };
  renderStatic();

  fetch("track/budapest-kor.gpx")
    .then(r => { if(!r.ok) throw new Error("nincs fájl"); return r.text(); })
    .then(txt => render(parseGPX(txt)))
    .catch(() => {
      const s = document.getElementById("setup");
      s.hidden = false;
      s.innerHTML = t("noGPX");
    });

  fetch(FINISHERS_URL)
    .then(r => r.ok ? r.json() : null)
    .then(list => { if (Array.isArray(list)){ FINISHERS = list; renderFinishers(); } })
    .catch(() => {});
}

boot();
</script>
